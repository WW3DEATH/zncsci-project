0x7c3aed,transparent:true,opacity:.5,wireframe:true}));o.position.set(Math.cos(a)*2,Math.sin(a)*2,0);mG.add(o);const lG=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),o.position.clone()]);mG.add(new THREE.Line(lG,new THREE.LineBasicMaterial({color:0x00e8a2,transparent:true,opacity:.4})))}mG.position.set(-18,5,-5);s.add(mG);let time=0;function anim(){requestAnimationFrame(anim);time+=.003;s.children[0].rotation.y=time*.5;s.children[0].rotation.x=time*.2;hG.rotation.y=time;mG.rotation.y=time*2;mG.rotation.x=time;r.render(s,cam)}anim();window.addEventListener("resize",()=>{cam.aspect=window.innerWidth/window.innerHeight;cam.updateProjectionMatrix();r.setSize(window.innerWidth,window.innerHeight)})}

function toast(m,t="info"){const c=document.getElementById("toasts"),e=document.createElement("div");e.className=`toast ${t}`;const i=t==="success"?"fa-check-circle":t==="error"?"fa-exclamation-circle":"fa-info-circle";e.innerHTML=`<i class="fas ${i}"></i> ${m}`;c.appendChild(e);setTimeout(()=>e.remove(),4e3)}
function fmtDate(t){if(!t)return"";return new Date(t).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function initials(n){return(n||"U").split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2)}
function genId(){return db.ref().child("tmp").push().key}
function esc(s){if(!s)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function fbErr(err){console.error(err);toast("Error: "+(err.message||err),"error")}
function closeModal(id){document.getElementById(id)?.remove()}
function createModal(id){const o=document.createElement("div");o.className="modal-overlay";o.id=id;document.body.appendChild(o);return o}

function signUp(email,pw,name,phone,wa){const r=email.trim().toLowerCase()===ADMIN_EMAIL.toLowerCase()?"admin":"student";return auth.createUserWithEmailAndPassword(email,pw).then(c=>db.ref("users/"+c.user.uid).set({name:name||"User",email:email||"",phone:phone||"",whatsapp:wa||"",role:r,createdAt:firebase.database.ServerValue.TIMESTAMP,online:true})).then(()=>toast(r==="admin"?"Admin account created!":"Account created! You are a Student.","success")).catch(e=>fbErr(e))}
function logIn(email,pw){return auth.signInWithEmailAndPassword(email,pw).then(()=>toast("Welcome back!","success")).catch(e=>fbErr(e))}
function logOut(){if(S.currentUser)db.ref("users/"+S.currentUser.uid+"/online").set(false);auth.signOut();S.currentUser=null;S.userData=null;cleanListeners();render()}
function cleanListeners(){[S.chatListeners,S.qnaListeners,S.msgListeners].forEach(a=>a.forEach(f=>f()));S.chatListeners=[];S.qnaListeners=[];S.msgListeners=[]}

function render(){document.getElementById("app").innerHTML=!S.currentUser?(S.currentSection==="signup"?renderSignUp():renderLanding()):renderMainLayout();if(S.currentUser)loadDashboard()}

function renderLanding(){return`<div class="landing-page"><div class="landing-logo"><i class="fas fa-atom"></i></div><h1 class="landing-title">Zahira College Mawanella<br>Science Project</h1><p class="landing-sub">A collaborative platform for A/L Science students and teachers.</p><div class="landing-btns"><button class="btn btn-primary" onclick="S.currentSection='signup';render()"><i class="fas fa-rocket"></i> Get Started</button><button class="btn btn-secondary" onclick="showLoginModal()"><i class="fas fa-sign-in-alt"></i> Sign In</button></div><div class="landing-features"><div class="landing-feature"><div class="landing-feature-num">3</div><div class="landing-feature-label">Batches</div></div><div class="landing-feature"><div class="landing-feature-num">3</div><div class="landing-feature-label">Roles</div></div><div class="landing-feature"><div class="landing-feature-num">&infin;</div><div class="landing-feature-label">Knowledge</div></div></div></div>`}

function showLoginModal(){const m=createModal("login-modal");m.innerHTML=`<div class="modal"><h3><i class="fas fa-sign-in-alt"></i> Sign In</h3><div class="form-group"><label>Email</label><input type="email" id="li-email"></div><div class="form-group"><label>Password</label><input type="password" id="li-pass"></div><button class="btn btn-primary w-full" id="li-btn" style="justify-content:center"><i class="fas fa-arrow-right"></i> Sign In</button><div class="auth-toggle" style="margin-top:.8rem"><a onclick="closeModal('login-modal')">Cancel</a></div></div>`;m.addEventListener("click",e=>{if(e.target===m)closeModal("login-modal")});document.getElementById("li-btn").addEventListener("click",()=>{const e=document.getElementById("li-email").value,p=document.getElementById("li-pass").value;if(!e||!p)return toast("Fill in all fields","error");logIn(e,p).then(()=>closeModal("login-modal"))})}

function renderMainLayout(){const u=S.userData||{},r=u.role||"student",ia=r==="admin";return`${renderMobileHdr()}<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSB()"></div><div class="main-layout"><aside class="sidebar" id="sidebar"><div class="sidebar-header"><div class="sidebar-logo">Z</div><div class="sidebar-brand"><span>Zahira</span> Science</div></div><nav class="sidebar-nav"><div class="nav-section">Main</div><div class="nav-item ${S.currentSection==="dashboard"?"active":""}" onclick="nav('dashboard')"><i class="fas fa-th-large"></i> Dashboard</div><div class="nav-section">Batches</div><div id="batch-nav"><div class="nav-item text-dim" style="font-size:.85rem"><div class="spinner"></div></div></div><div class="nav-section">Community</div><div class="nav-item ${S.currentSection==="users"?"active":""}" onclick="nav('users')"><i class="fas fa-users"></i> Users</div><div class="nav-item ${S.currentSection==="chat"?"active":""}" onclick="nav('chat')"><i class="fas fa-comments"></i> Chat</div>${ia?`<div class="nav-section">Admin</div><div class="nav-item ${S.currentSection==="admin"?"active":""}" onclick="nav('admin')"><i class="fas fa-shield-alt"></i> Admin Panel</div>`:""}<div class="nav-section">Account</div><div class="nav-item ${S.currentSection==="profile"?"active":""}" onclick="nav('profile')"><i class="fas fa-user-circle"></i> Profile</div></nav><div class="sidebar-footer"><div class="sidebar-avatar">${initials(u.name)}</div><div class="sidebar-user-info"><div class="sidebar-user-name">${esc(u.name)||"User"}</div><div class="sidebar-user-role"><span class="role-badge ${r}">${r}</span></div></div><button onclick="logOut()" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:1.1rem"><i class="fas fa-sign-out-alt"></i></button></div></aside><main class="main-content" id="main-content">${renderSection()}</main></div>`}
function renderMobileHdr(){return`<div class="mobile-header"><button class="mobile-menu-btn" onclick="toggleSB()"><i class="fas fa-bars"></i></button><div class="sidebar-brand"><span style="color:var(--primary)">Zahira</span> Science</div></div>`}
function toggleSB(){document.getElementById("sidebar")?.classList.toggle("open");document.getElementById("sidebar-overlay")?.classList.toggle("show")}
function nav(s,d){S.currentSection=s;if(d){if(d.batch!==undefined)S.currentBatch=d.batch;if(d.chatId!==undefined)S.currentChatId=d.chatId}render();if(window.innerWidth<768){document.getElementById("sidebar")?.classList.remove("open");document.getElementById("sidebar-overlay")?.classList.remove("show")}}
function renderSection(){switch(S.currentSection){case"dashboard":return renderDash();case"batch":return renderBatch();case"users":return renderUsers();case"chat":return renderChat();case"profile":return renderProfile();case"admin":return renderAdmin();default:return renderDash()}}

function renderDash(){return`<div class="page-header"><h1 class="page-title">Welcome, <span>${esc(S.userData?.name)||"User"}</span></h1></div><div class="cards-grid" id="dash-grid"><div class="card text-center text-dim" style="padding:3rem"><div class="spinner" style="width:30px;height:30px;margin:0 auto 1rem"></div>Loading...</div></div>`}

function loadDashboard(){db.ref("batches").once("value",snap=>{let b=snap.val()||{};if(Object.keys(b).length===0){["A/L 2026","A/L 2027","A/L 2028"].forEach(n=>{const id=genId(),co={};DEFAULT_CATS.forEach(c=>{co[genId()]=c});db.ref("batches/"+id).set({name:n,categories:co,createdAt:firebase.database.ServerValue.TIMESTAMP})});setTimeout(loadDashboard,2e3);return}Object.entries(b).forEach(([k,bb])=>{const cats=bb.categories?Object.values(bb.categories).filter(x=>typeof x==="string"):[];if(cats.length===0){const co={};DEFAULT_CATS.forEach(c=>{co[genId()]=c});db.ref("batches/"+k+"/categories").set(co)}});db.ref("batches").once("value",snap2=>{b=snap2.val()||{};S.batchesCache=b;const ni=document.getElementById("batch-nav");if(ni){let h="";Object.keys(b).forEach(k=>{h+=`<div class="nav-item ${S.currentBatch===k?"active":""}" onclick="nav('batch',{batch:'${k}'})"><i class="fas fa-flask"></i> ${esc(b[k].name)}</div>`});ni.innerHTML=h}const dg=document.getElementById("dash-grid");if(dg){let h="";Object.keys(b).forEach(k=>{const bb=b[k],c=bb.categories?Object.values(bb.categories).filter(x=>typeof x==="string"):[];h+=`<div class="batch-card card-3d" onclick="nav('batch',{batch:'${k}'})"><div class="card-3d-inner"><div class="batch-year">${esc(bb.name.replace("A/L ",""))}</div><div class="batch-label">${esc(bb.name)}</div><div class="batch-stats"><div class="batch-stat"><i class="fas fa-tag"></i> ${c.length} Categories</div></div><div style="margin-top:.8rem;display:flex;gap:4px;flex-wrap:wrap">${c.map(x=>`<span class="qna-category-tag">${esc(x)}</span>`).join("")}</div></div></div>`});dg.innerHTML=h}});if(S.currentUser){db.ref("chatRequests").orderByChild("to").equalTo(S.currentUser.uid).once("value",s=>{const r=s.val()||{},p=Object.values(r).filter(x=>x.status==="pending").length,bd=document.getElementById("chat-req-badge");if(bd&&p>0)bd.innerHTML=`<span style="background:var(--danger);color:#fff;border-radius:50%;padding:1px 6px;font-size:.7rem;font-weight:700">${p}</span>`})}})}

function renderBatch(){const bid=S.currentBatch;if(!bid)return'<div class="empty-state"><i class="fas fa-arrow-left"></i><p>Select a batch</p></div>';setTimeout(()=>loadBatchData(bid),50);const canUp=S.userData?.role==="teacher"||S.userData?.role==="admin";return`<div class="page-header"><h1 class="page-title" id="b-title">Loading...</h1><div class="flex gap-1"><button class="btn btn-secondary btn-sm" id="ask-q-btn"><i class="fas fa-plus"></i> Ask Question</button>${canUp?`<button class="btn btn-secondary btn-sm" id="up-file-btn"><i class="fas fa-upload"></i> Upload File</button>`:""}</div></div><div class="cat-tabs" id="b-cats"></div><div id="b-content"><div class="text-center text-dim mt-3"><div class="spinner" style="width:24px;height:24px;margin:0 auto"></div></div></div><div id="b-files" class="mt-3"></div>`}

document.addEventListener("click",e=>{if(e.target.id==="ask-q-btn"||e.target.closest("#ask-q-btn"))showAskQ();if(e.target.id==="up-file-btn"||e.target.closest("#up-file-btn"))showUpFile()});

function loadBatchData(bid){db.ref("batches/"+bid).once("value",snap=>{const b=snap.val();if(!b)return;const cats=b.categories?Object.values(b.categories).filter(x=>typeof x==="string"):[];if(cats.length===0){const co={};DEFAULT_CATS.forEach(c=>{co[genId()]=c});db.ref("batches/"+bid+"/categories").set(co);setTimeout(()=>loadBatchData(bid),1e3);return}const t=document.getElementById("b-title");if(t)t.innerHTML=`<span>${esc(b.name)}</span>`;const cc=document.getElementById("b-cats");if(cc){let h=`<div class="cat-tab ${S.currentCategory==="all"?"active":""}" onclick="setCat('all')">All</div>`;cats.forEach(c=>{h+=`<div class="cat-tab ${S.currentCategory===c?"active":""}" onclick="setCat('${esc(c)}')">${esc(c)}</div>`});cc.innerHTML=h}loadQnA(bid);loadFiles(bid)})}
function setCat(c){S.currentCategory=c;if(S.currentBatch)loadBatchData(S.currentBatch)}

function loadQnA(bid){S.qnaListeners.forEach(f=>f());S.qnaListeners=[];const ref=db.ref("qna/"+bid);const cb=ref.on("value",snap=>{const q=snap.val()||{},ct=document.getElementById("b-content");if(!ct)return;let h="";const qk=Object.keys(q);if(qk.length===0){h='<div class="empty-state"><i class="fas fa-question-circle"></i><p>No questions yet. Be the first to ask!</p></div>'}else{qk.reverse().forEach(k=>{const qq=q[k];if(S.currentCategory!=="all"&&qq.category!==S.currentCategory)return;const ans=qq.answers?Object.entries(qq.answers):[];const canReply=S.userData?.role==="teacher"||S.userData?.role==="admin";const canDel=qq.authorId===S.currentUser?.uid||S.userData?.role==="admin";h+=`<div class="qna-item"><div class="qna-header"><div class="qna-avatar">${initials(qq.authorName)}</div><div class="qna-meta"><div class="qna-author">${esc(qq.authorName)||"Unknown"} <span class="role-badge ${qq.authorRole||"student"}" style="font-size:.65rem">${qq.authorRole||"student"}</span></div><div class="qna-time">${fmtDate(qq.timestamp)}</div></div></div><span class="qna-category-tag">${esc(qq.category||"General")}</span><div class="qna-title">${esc(qq.title)}</div><div class="qna-body">${esc(qq.content)}</div>${qq.fileData?`<div class="file-item mt-1"><i class="fas fa-paperclip"></i><div class="file-item-info"><div class="file-item-name">${esc(qq.fileName||"Attachment")}</div></div><a href="${qq.fileData}" download="${esc(qq.fileName||"file")}" class="btn btn-xs btn-secondary"><i class="fas fa-download"></i></a></div>`:""}<div class="qna-actions"><button class="btn btn-xs btn-secondary" onclick="toggleAns('${k}')"><i class="fas fa-comments"></i> ${ans.length} Answer${ans.length!==1?"s":""}</button>${canReply?`<button class="btn btn-xs btn-primary" onclick="showReplyModal('${bid}','${k}')"><i class="fas fa-reply"></i> Reply</button>`:""}${canDel?`<button class="btn btn-xs btn-danger" onclick="delQuestion('${bid}','${k}')"><i class="fas fa-trash"></i></button>`:""}</div><div id="ans-${k}" class="hidden mt-1">${ans.map(([ak,a])=>{const canDelAns=a.authorId===S.currentUser?.uid||S.userData?.role==="admin";return`<div class="answer-item"><div class="flex items-center gap-1 mb-1"><div class="qna-avatar" style="width:24px;height:24px;font-size:.6rem">${initials(a.authorName)}</div><strong style="font-size:.85rem">${esc(a.authorName)}</strong><span class="role-badge ${a.authorRole||"student"}" style="font-size:.6rem">${a.authorRole||"student"}</span><span class="text-dim" style="font-size:.72rem">${fmtDate(a.timestamp)}</span>${canDelAns?`<button class="btn btn-xs btn-danger" style="margin-left:auto" onclick="delAnswer('${bid}','${k}','${ak}')"><i class="fas fa-trash"></i></button>`:""}</div><div style="font-size:.9rem;line-height:1.5">${esc(a.content)}</div>${a.fileData?`<div class="file-item mt-1"><i class="fas fa-paperclip"></i><div class="file-item-info"><div class="file-item-name">${esc(a.fileName||"Attachment")}</div></div><a href="${a.fileData}" download="${esc(a.fileName||"file")}" class="btn btn-xs btn-secondary"><i class="fas fa-download"></i></a></div>`:""}</div>`}).join("")}</div></div>`})}ct.innerHTML=h});S.qnaListeners.push(()=>ref.off("value",cb))}
function toggleAns(k){document.getElementById("ans-"+k)?.classList.toggle("hidden")}

function showAskQ(){const bid=S.currentBatch;if(!bid)return toast("Select a batch first","error");db.ref("batches/"+bid+"/categories").once("value",snap=>{const cats=snap.val()?Object.values(snap.val()).filter(x=>typeof x==="string"):[];if(!cats.length)cats.push("General");const m=createModal("ask-modal");m.innerHTML=`<div class="modal"><h3><i class="fas fa-question-circle"></i> Ask a Question</h3><div class="form-group"><label>Category</label><select id="q-cat">${cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select></div><div class="form-group"><label>Title</label><input type="text" id="q-title" placeholder="Your question title"></div><div class="form-group"><label>Description</label><textarea id="q-body" placeholder="Describe your question..."></textarea></div><div class="form-group"><label>Attachment (optional, max 1MB)</label><input type="file" id="q-file" style="border:none;padding:0;background:transparent"></div><div class="flex gap-1"><button class="btn btn-primary" id="q-submit"><i class="fas fa-paper-plane"></i> Submit</button><button class="btn btn-secondary" onclick="closeModal('ask-modal')">Cancel</button></div></div>`;m.addEventListener("click",e=>{if(e.target===m)closeModal("ask-modal")});document.getElementById("q-submit").addEventListener("click",()=>doSubmitQuestion(bid))})}

function doSubmitQuestion(bid){try{const cat=document.getElementById("q-cat").value,title=document.getElementById("q-title").value.trim(),body=document.getElementById("q-body").value.trim(),fi=document.getElementById("q-file");if(!title||!body){toast("Fill in title and description","error");return}const btn=document.getElementById("q-submit");btn.classList.add("btn-loading");const id=genId();const data={title:title,content:body,category:cat||"General",authorId:getUserId(),authorName:getUserName(),authorRole:getUserRole(),timestamp:firebase.database.ServerValue.TIMESTAMP};const save=d=>{db.ref("qna/"+bid+"/"+id).set(d).then(()=>{toast("Question posted!","success");closeModal("ask-modal")}).catch(e=>{btn.classList.remove("btn-loading");fbErr(e)})};if(fi&&fi.files&&fi.files.length>0){const f=fi.files[0];if(f.size>1048576){btn.classList.remove("btn-loading");toast("File too large (max 1MB)","error");return}const r=new FileReader();r.onload=e=>{data.fileData=e.target.result;data.fileName=f.name;save(data)};r.onerror=()=>{btn.classList.remove("btn-loading");toast("Failed to read file","error")};r.readAsDataURL(f)}else{save(data)}}catch(e){fbErr(e)}}

function showReplyModal(bid,qid){const m=createModal("reply-modal");m.innerHTML=`<div class="modal"><h3><i class="fas fa-reply"></i> Post an Answer</h3><div class="form-group"><label>Your Answer</label><textarea id="a-body" placeholder="Write your answer..."></textarea></div><div class="form-group"><label>Attachment (optional, max 1MB)</label><input type="file" id="a-file" style="border:none;padding:0;background:transparent"></div><div class="flex gap-1"><button class="btn btn-primary" id="a-submit"><i class="fas fa-paper-plane"></i> Post</button><button class="btn btn-secondary" onclick="closeModal('reply-modal')">Cancel</button></div></div>`;m.addEventListener("click",e=>{if(e.target===m)closeModal("reply-modal")});document.getElementById("a-submit").addEventListener("click",()=>doSubmitAnswer(bid,qid))}

function doSubmitAnswer(bid,qid){try{const body=document.getElementById("a-body").value.trim(),fi=document.getElementById("a-file");if(!body){toast("Write an answer","error");return}const btn=document.getElementById("a-submit");btn.classList.add("btn-loading");const id=genId();const data={content:body,authorId:getUserId(),authorName:getUserName(),authorRole:getUserRole(),timestamp:firebase.database.ServerValue.TIMESTAMP};const save=d=>{db.ref("qna/"+bid+"/"+qid+"/answers/"+id).set(d).then(()=>{toast("Answer posted!","success");closeModal("reply-modal")}).catch(e=>{btn.classList.remove("btn-loading");fbErr(e)})};if(fi&&fi.files&&fi.files.length>0){const f=fi.files[0];if(f.size>1048576){btn.classList.remove("btn-loading");toast("File too large (max 1MB)","error");return}const r=new FileReader();r.onload=e=>{data.fileData=e.target.result;data.fileName=f.name;save(data)};r.onerror=()=>{btn.classList.remove("btn-loading");toast("Failed to read file","error")};r.readAsDataURL(f)}else{save(data)}}catch(e){fbErr(e)}}

function delQuestion(bid,qid){if(!confirm("Delete this question?"))return;db.ref("qna/"+bid+"/"+qid).remove().then(()=>toast("Question deleted","success")).catch(fbErr)}
function delAnswer(bid,qid,aid){if(!confirm("Delete this answer?"))return;db.ref("qna/"+bid+"/"+qid+"/answers/"+aid).remove().then(()=>toast("Answer deleted","success")).catch(fbErr)}

function loadFiles(bid){db.ref("files/"+bid).once("value",snap=>{const f=snap.val()||{},ct=document.getElementById("b-files");if(!ct)return;let h="";const fl=Object.entries(f).filter(([,x])=>S.currentCategory==="all"||x.category===S.currentCategory);if(fl.length>0){h=`<h3 class="mb-2" style="font-family:Orbitron;font-size:1.1rem"><i class="fas fa-folder-open text-primary"></i> Files & Resources</h3>`;fl.forEach(([k,ff])=>{h+=`<div class="file-item"><i class="fas fa-file-alt"></i><div class="file-item-info"><div class="file-item-name">${esc(ff.name)}</div><div class="file-item-meta">By ${esc(ff.uploadedByName)} &bull; ${fmtDate(ff.timestamp)} &bull; ${esc(ff.category||"General")}</div></div><a href="${ff.fileData}" download="${esc(ff.name)}" class="btn btn-xs btn-primary"><i class="fas fa-download"></i></a>${ff.uploadedBy===getUserId()||S.userData?.role==="admin"?`<button class="btn btn-xs btn-danger" onclick="delFile('${bid}','${k}')"><i class="fas fa-trash"></i></button>`:""}</div>`})}ct.innerHTML=h})}

function showUpFile(){const bid=S.currentBatch;if(!bid)return;db.ref("batches/"+bid+"/categories").once("value",snap=>{const cats=snap.val()?Object.values(snap.val()).filter(x=>typeof x==="string"):[];if(!cats.length)cats.push("General");const m=createModal("upload-modal");m.innerHTML=`<div class="modal"><h3><i class="fas fa-upload"></i> Upload File</h3><div class="form-group"><label>Category</label><select id="f-cat">${cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select></div><div class="form-group"><label>File (max 2MB)</label><input type="file" id="f-file" style="border:none;padding:0;background:transparent"></div><div class="flex gap-1"><button class="btn btn-primary" id="f-submit"><i class="fas fa-cloud-upload-alt"></i> Upload</button><button class="btn btn-secondary" onclick="closeModal('upload-modal')">Cancel</button></div></div>`;m.addEventListener("click",e=>{if(e.target===m)closeModal("upload-modal")});document.getElementById("f-submit").addEventListener("click",()=>doUploadFile(bid))})}

function doUploadFile(bid){try{const cat=document.getElementById("f-cat").value,fi=document.getElementById("f-file");if(!fi||!fi.files||!fi.files.length){toast("Select a file","error");return}const f=fi.files[0];if(f.size>2097152){toast("File too large (max 2MB)","error");return}const btn=document.getElementById("f-submit");btn.classList.add("btn-loading");const r=new FileReader();r.onload=e=>{const id=genId();db.ref("files/"+bid+"/"+id).set({name:f.name||"file",fileData:e.target.result,category:cat||"General",uploadedBy:getUserId(),uploadedByName:getUserName(),timestamp:firebase.database.ServerValue.TIMESTAMP}).then(()=>{toast("File uploaded!","success");closeModal("upload-modal")}).catch(er=>{btn.classList.remove("btn-loading");fbErr(er)})};r.onerror=()=>{btn.classList.remove("btn-loading");toast("Failed to read file","error")};r.readAsDataURL(f)}catch(e){fbErr(e)}}
function delFile(bid,fid){if(!confirm("Delete this file?"))return;db.ref("files/"+bid+"/"+fid).remove().then(()=>toast("File deleted","success")).catch(fbErr)}

function renderUsers(){setTimeout(()=>{db.ref("users").once("value",snap=>{const u=snap.val()||{},ct=document.getElementById("users-grid");if(!ct)return;let h="";Object.keys(u).forEach(uid=>{if(uid===S.currentUser.uid)return;const uu=u[uid];h+=`<div class="user-card"><div class="user-card-avatar">${initials(uu.name)}</div><div class="user-card-info"><div class="user-card-name">${esc(uu.name)}</div><div class="user-card-role"><span class="role-badge ${uu.role}">${uu.role}</span></div></div><button class="btn btn-xs btn-primary" onclick="sendChatReq('${uid}')"><i class="fas fa-comment"></i> Chat</button></div>`});if(!h)h='<div class="empty-state"><i class="fas fa-users"></i><p>No other users yet</p></div>';ct.innerHTML=h})},50);return`<div class="page-header"><h1 class="page-title"><span>Users</span> Directory</h1></div><div class="cards-grid" id="users-grid"><div class="text-center text-dim" style="padding:3rem"><div class="spinner" style="width:24px;height:24px;margin:0 auto"></div></div></div>`}

function sendChatReq(toUid){const from=getUserId();if(!from)return;db.ref("chatRequests").orderByChild("from").equalTo(from).once("value",snap=>{const ex=snap.val()||{};if(Object.values(ex).some(r=>r.to===toUid&&r.status!=="rejected"))return toast("Request already sent","info");db.ref("chatRooms").once("value",snap2=>{const rooms=snap2.val()||{};if(Object.values(rooms).some(r=>r.participants&&r.participants[from]&&r.participants[toUid]))return toast("Already have a chat","info");db.ref("chatRequests/"+genId()).set({from:from,to:toUid,fromName:getUserName(),status:"pending",timestamp:firebase.database.ServerValue.TIMESTAMP}).then(()=>toast("Chat request sent!","success")).catch(fbErr)})})}

function renderChat(){setTimeout(loadChatList,100);return`<div class="page-header"><h1 class="page-title"><span>Chat</span></h1><button class="btn btn-secondary btn-sm" onclick="showChatReqs()"><i class="fas fa-inbox"></i> Requests</button></div><div class="chat-layout"><div class="chat-list-panel"><div class="chat-list-header"><div class="search-box w-full"><i class="fas fa-search"></i><input placeholder="Search chats..."></div></div><div class="chat-list" id="chat-list"><div class="text-center text-dim" style="padding:2rem"><div class="spinner" style="margin:0 auto"></div></div></div></div><div class="chat-room-panel" id="chat-panel"><div class="empty-state" style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center"><i class="fas fa-comments" style="font-size:3rem;opacity:.2;margin-bottom:1rem"></i><p>Select a conversation or start a new one</p></div></div></div>`}

function loadChatList(){const uid=getUserId();if(!uid)return;S.chatListeners.forEach(f=>f());S.chatListeners=[];const ref=db.ref("chatRooms");const cb=ref.on("value",snap=>{const rooms=snap.val()||{},ct=document.getElementById("chat-list");if(!ct)return;S.chatRoomsList=[];Object.keys(rooms).forEach(rid=>{const room=rooms[rid];if(!room.participants||!room.participants[uid])return;const oid=Object.keys(room.participants).find(id=>id!==uid);if(!oid)return;S.chatRoomsList.push({roomId:rid,otherUid:oid,otherName:room.participantNames?.[oid]||"User",lastMessage:room.lastMessage||"No messages"})});let h="";if(!S.chatRoomsList.length){h='<div class="text-center text-dim" style="padding:2rem;font-size:.9rem">No conversations yet.<br>Start one from Users Directory!</div>'}else{S.chatRoomsList.forEach((room,idx)=>{h+=`<div class="chat-list-item ${S.currentChatId===room.roomId?"active":""}" data-chat-idx="${idx}"><div class="user-card-avatar" style="width:40px;height:40px;font-size:.85rem">${initials(room.otherName)}</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:.9rem">${esc(room.otherName)}</div><div style="font-size:.78rem;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(room.lastMessage)}</div></div></div>`})}ct.innerHTML=h});S.chatListeners.push(()=>ref.off("value",cb))}

document.addEventListener("click",e=>{const ci=e.target.closest("[data-chat-idx]");if(ci){const idx=parseInt(ci.dataset.chatIdx);openChatByIdx(idx)}});

function openChatByIdx(idx){const room=S.chatRoomsList[idx];if(!room)return;S.currentChatId=room.roomId;const p=document.getElementById("chat-panel");if(!p)return;p.innerHTML=`<div class="chat-room-header"><div class="user-card-avatar" style="width:36px;height:36px;font-size:.8rem">${initials(room.otherName)}</div><div><div style="font-weight:600">${esc(room.otherName)}</div><div style="font-size:.75rem;color:var(--text-dim)">Private Chat</div></div></div><div class="chat-messages" id="chat-msgs"></div><div class="chat-input-area"><input type="text" id="chat-input" placeholder="Type a message..."><button class="btn btn-primary btn-sm" id="chat-send-btn"><i class="fas fa-paper-plane"></i></button></div>`;S.msgListeners.forEach(f=>f());S.msgListeners=[];const ref=db.ref("chatMessages/"+room.roomId);const cb=ref.on("value",snap=>{const msgs=snap.val()||{},ct=document.getElementById("chat-msgs");if(!ct)return;let h="";Object.entries(msgs).sort((a,b)=>(a[1].timestamp||0)-(b[1].timestamp||0)).forEach(([mid,m])=>{const isSent=m.senderId===getUserId();const canDel=isSent||S.userData?.role==="admin";h+=`<div class="chat-msg ${isSent?"sent":"received"}">${esc(m.content)}${canDel?`<button class="chat-msg-delete" onclick="delChatMsg('${room.roomId}','${mid}')" title="Delete"><i class="fas fa-times"></i></button>`:""}<div class="chat-msg-time">${fmtDate(m.timestamp)}</div></div>`});ct.innerHTML=h;ct.scrollTop=ct.scrollHeight});S.msgListeners.push(()=>ref.off("value",cb));document.getElementById("chat-send-btn").addEventListener("click",sendChatMsg);document.getElementById("chat-input").addEventListener("keypress",e=>{if(e.key==="Enter")sendChatMsg()});document.querySelectorAll(".chat-list-item").forEach((el,i)=>el.classList.toggle("active",i===idx))}

function sendChatMsg(){if(!S.currentChatId)return;const i=document.getElementById("chat-input");if(!i)return;const c=i.value.trim();if(!c)return;const id=genId();db.ref("chatMessages/"+S.currentChatId+"/"+id).set({content:c,senderId:getUserId(),senderName:getUserName(),timestamp:firebase.database.ServerValue.TIMESTAMP}).then(()=>{i.value=""}).catch(fbErr);db.ref("chatRooms/"+S.currentChatId).update({lastMessage:c.slice(0,50),lastTimestamp:firebase.database.ServerValue.TIMESTAMP}).catch(fbErr)}

function delChatMsg(roomId,msgId){if(!confirm("Delete this message?"))return;db.ref("chatMessages/"+roomId+"/"+msgId).remove().then(()=>toast("Message deleted","success")).catch(fbErr)}

function showChatReqs(){const uid=getUserId();if(!uid)return;db.ref("chatRequests").orderByChild("to").equalTo(uid).once("value",snap=>{const reqs=snap.val()||{},m=createModal("chatreq-modal");let h='<div class="modal"><h3><i class="fas fa-inbox"></i> Chat Requests</h3>';const pending=Object.entries(reqs).filter(([,r])=>r.status==="pending");if(!pending.length){h+='<div class="text-center text-dim" style="padding:1rem">No pending requests</div>'}else{pending.forEach(([k,r])=>{h+=`<div class="chat-request-item"><div class="user-card-avatar" style="width:36px;height:36px">${initials(r.fromName)}</div><div style="flex:1"><strong>${esc(r.fromName)}</strong><br><span class="text-dim" style="font-size:.78rem">${fmtDate(r.timestamp)}</span></div><button class="btn btn-xs btn-primary" onclick="acceptChatReq('${k}','${r.from}')">Accept</button><button class="btn btn-xs btn-danger" onclick="rejectChatReq('${k}')">Decline</button></div>`})}h+=`<button class="btn btn-secondary w-full mt-2" onclick="closeModal('chatreq-modal')" style="justify-content:center">Close</button></div>`;m.innerHTML=h;m.addEventListener("click",e=>{if(e.target===m)closeModal("chatreq-modal")})})}

function acceptChatReq(reqId,fromUid){db.ref("chatRequests/"+reqId).update({status:"accepted"}).catch(fbErr);const roomId=genId(),p={},pn={};p[getUserId()]=true;p[fromUid]=true;pn[getUserId()]=getUserName();db.ref("users/"+fromUid+"/name").once("value",snap=>{pn[fromUid]=snap.val()||"User";db.ref("chatRooms/"+roomId).set({participants:p,participantNames:pn,lastMessage:"Chat started",lastTimestamp:firebase.database.ServerValue.TIMESTAMP,createdAt:firebase.database.ServerValue.TIMESTAMP}).then(()=>{toast("Chat request accepted!","success");closeModal("chatreq-modal");S.currentChatId=roomId;nav("chat")}).catch(fbErr)})}

function rejectChatReq(reqId){db.ref("chatRequests/"+reqId).update({status:"rejected"}).then(()=>{toast("Chat request declined","info");closeModal("chatreq-modal")}).catch(fbErr)}

function renderProfile(){const u=S.userData||{};return`<div class="page-header"><h1 class="page-title">My <span>Profile</span></h1></div><div class="card-glass" style="max-width:600px"><div class="flex items-center gap-2 mb-3"><div class="user-card-avatar" style="width:64px;height:64px;font-size:1.5rem">${initials(u.name)}</div><div><h2 style="font-size:1.3rem">${esc(u.name)}</h2><span class="role-badge ${u.role}" style="font-size:.8rem">${u.role}</span></div></div><div style="display:grid;gap:.8rem"><div class="form-group"><label>Email</label><input type="email" value="${esc(u.email)||""}" disabled style="opacity:.6"></div><div class="form-group"><label>Phone</label><input type="tel" id="pf-phone" value="${esc(u.phone)||""}"></div><div class="form-group"><label>WhatsApp</label><input type="tel" id="pf-wa" value="${esc(u.whatsapp)||""}"></div><button class="btn btn-primary" id="pf-save"><i class="fas fa-save"></i> Update Profile</button></div></div><div class="mt-3"><button class="btn btn-danger btn-sm" onclick="logOut()"><i class="fas fa-sign-out-alt"></i> Logout</button></div>`}
document.addEventListener("click",e=>{if(e.target.id==="pf-save"||e.target.closest("#pf-save")){const p=document.getElementById("pf-phone").value.trim(),w=document.getElementById("pf-wa").value.trim();db.ref("users/"+getUserId()).update({phone:p||"",whatsapp:w||""}).then(()=>{toast("Profile updated!","success");if(S.userData){S.userData.phone=p;S.userData.whatsapp=w}}).catch(fbErr)}});

function renderAdmin(){if(S.userData?.role!=="admin")return'<div class="empty-state"><i class="fas fa-lock"></i><p>Access denied</p></div>';return`<div class="page-header"><h1 class="page-title"><span>Admin</span> Panel</h1></div><div class="admin-tabs"><div class="admin-tab ${S.adminTab==="batches"?"active":""}" onclick="setATab('batches')"><i class="fas fa-layer-group"></i> Batches</div><div class="admin-tab ${S.adminTab==="categories"?"active":""}" onclick="setATab('categories')"><i class="fas fa-tags"></i> Categories</div><div class="admin-tab ${S.adminTab==="users"?"active":""}" onclick="setATab('users')"><i class="fas fa-users-cog"></i> Users</div><div class="admin-tab ${S.adminTab==="chats"?"active":""}" onclick="setATab('chats')"><i class="fas fa-eye"></i> Chats</div></div><div id="admin-content">${renderATab()}</div>`}
function setATab(t){S.adminTab=t;const ct=document.getElementById("admin-content");if(ct)ct.innerHTML=renderATab();document.querySelectorAll(".admin-tab").forEach(el=>{const tl={batches:"batch",categories:"categor",users:"user",chats:"chat"};el.classList.toggle("active",el.textContent.toLowerCase().includes(tl[t]||t))})}
function renderATab(){switch(S.adminTab){case"batches":return renderABatches();case"categories":return renderACats();case"users":return renderAUsers();case"chats":return renderAChats();default:return""}}

function renderABatches(){setTimeout(()=>{db.ref("batches").once("value",snap=>{const b=snap.val()||{},ct=document.getElementById("a-batches");if(!ct)return;let h="";if(!Object.keys(b).length){h='<div class="text-dim text-center" style="padding:1rem">No batches</div>'}else{Object.entries(b).forEach(([k,bb])=>{const cats=bb.categories?Object.values(bb.categories).filter(x=>typeof x==="string"):[];h+=`<div class="flex items-center justify-between" style="padding:.8rem;background:var(--surface2);border-radius:var(--radius-sm);margin-bottom:.5rem"><div><strong>${esc(bb.name)}</strong><div class="text-dim" style="font-size:.8rem">${cats.join(", ")||"No categories"}</div></div><div class="flex gap-1"><button class="btn btn-xs btn-secondary" onclick="editBatch('${k}')"><i class="fas fa-edit"></i></button><button class="btn btn-xs btn-danger" onclick="delBatch('${k}')"><i class="fas fa-trash"></i></button></div></div>`})}ct.innerHTML=h})},50);return`<div class="card mb-2"><h3 style="margin-bottom:1rem"><i class="fas fa-plus-circle text-primary"></i> Add Batch</h3><div class="flex gap-1"><input type="text" id="new-batch-name" placeholder="e.g. A/L 2029" style="flex:1;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:Inter,sans-serif"><button class="btn btn-primary" id="add-batch-btn"><i class="fas fa-plus"></i> Add</button></div></div><div id="a-batches"><div class="text-center text-dim"><div class="spinner" style="margin:0 auto"></div></div></div>`}
document.addEventListener("click",e=>{if(e.target.id==="add-batch-btn"||e.target.closest("#add-batch-btn")){const n=document.getElementById("new-batch-name").value.trim();if(!n)return toast("Enter batch name","error");const id=genId(),co={};DEFAULT_CATS.forEach(c=>{co[genId()]=c});db.ref("batches/"+id).set({name:n,categories:co,createdAt:firebase.database.ServerValue.TIMESTAMP}).then(()=>{toast("Batch added!","success");document.getElementById("new-batch-name").value="";renderATab()}).catch(fbErr)}});
function editBatch(k){db.ref("batches/"+k).once("value",snap=>{const b=snap.val();if(!b)return;const m=createModal("edit-batch-modal");m.innerHTML=`<div class="modal"><h3><i class="fas fa-edit"></i> Edit Batch</h3><div class="form-group"><label>Batch Name</label><input type="text" id="eb-name" value="${esc(b.name)}"></div><div class="flex gap-1"><button class="btn btn-primary" id="eb-save"><i class="fas fa-save"></i> Save</button><button class="btn btn-secondary" onclick="closeModal('edit-batch-modal')">Cancel</button></div></div>`;m.addEventListener("click",e=>{if(e.target===m)closeModal("edit-batch-modal")});document.getElementById("eb-save").addEventListener("click",()=>{const n=document.getElementById("eb-name").value.trim();if(!n)return toast("Enter name","error");db.ref("batches/"+k+"/name").set(n).then(()=>{toast("Updated!","success");closeModal("edit-batch-modal");renderATab()}).catch(fbErr)})})}
function delBatch(k){if(!confirm("Delete this batch and all content?"))return;Promise.all([db.ref("batches/"+k).remove(),db.ref("qna/"+k).remove(),db.ref("files/"+k).remove()]).then(()=>toast("Batch deleted","success")).catch(fbErr).finally(renderATab)}

function renderACats(){setTimeout(()=>{db.ref("batches").once("value",snap=>{const b=snap.val()||{},ct=document.getElementById("a-cats");if(!ct)return;let h="";if(!Object.keys(b).length){h='<div class="text-dim text-center" style="padding:1rem">No batches</div>'}else{Object.entries(b).forEach(([k,bb])=>{const cats=bb.categories?Object.entries(bb.categories).filter(([,v])=>typeof v==="string"):[];h+=`<div class="card mb-2"><h4 style="margin-bottom:.8rem"><i class="fas fa-flask text-primary"></i> ${esc(bb.name)}</h4><div class="flex flex-wrap gap-1 mb-1">${cats.map(([ck,c])=>`<span class="qna-category-tag" style="display:inline-flex;align-items:center;gap:4px">${esc(c)}<button onclick="delCat('${k}','${ck}')" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:.7rem"><i class="fas fa-times"></i></button></span>`).join("")}${!cats.length?'<span class="text-dim" style="font-size:.85rem">No categories</span>':""}</div><div class="flex gap-1 mt-1"><input type="text" id="nc-${k}" placeholder="New category" style="flex:1;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.85rem"><button class="btn btn-xs btn-primary" onclick="addCat('${k}')"><i class="fas fa-plus"></i></button></div></div>`})}ct.innerHTML=h})},50);return`<div id="a-cats"><div class="text-center text-dim"><div class="spinner" style="margin:0 auto"></div></div></div>`}
function addCat(bk){const i=document.getElementById("nc-"+bk),c=i?.value.trim();if(!c)return toast("Enter category name","error");db.ref("batches/"+bk+"/categories/"+genId()).set(c).then(()=>{toast("Category added!","success");if(i)i.value="";renderATab()}).catch(fbErr)}
function delCat(bk,ck){if(!confirm("Delete this category?"))return;db.ref("batches/"+bk+"/categories/"+ck).remove().then(()=>{toast("Category deleted","success");renderATab()}).catch(fbErr)}

function renderAUsers(){setTimeout(()=>{db.ref("users").once("value",snap=>{const u=snap.val()||{},ct=document.getElementById("a-users");if(!ct)return;let h=`<div class="promote-banner mb-2"><i class="fas fa-user-shield"></i><div class="text"><strong>Role Management:</strong> Only Admin can assign Teacher role.</div></div><div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Phone</th><th>WhatsApp</th><th>Change Role</th><th>Actions</th></tr></thead><tbody>`;Object.entries(u).forEach(([uid,uu])=>{const ia=uu.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase();h+=`<tr><td style="font-weight:600">${esc(uu.name)}</td><td style="font-size:.8rem">${esc(uu.email)}</td><td><span class="role-badge ${uu.role}">${uu.role}</span></td><td style="font-size:.8rem">${esc(uu.phone)||"-"}</td><td style="font-size:.8rem">${esc(uu.whatsapp)||"-"}</td><td><select onchange="changeRole('${uid}',this.value)" style="background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:.78rem;cursor:pointer"><option value="student" ${uu.role==="student"?"selected":""}>Student</option><option value="teacher" ${uu.role==="teacher"?"selected":""}>Teacher</option><option value="admin" ${uu.role==="admin"?"selected":""}>Admin</option></select></td><td>${ia?'<span class="text-dim" style="font-size:.75rem"><i class="fas fa-shield-alt"></i> Protected</span>':`<button class="btn btn-xs btn-danger" onclick="delUser('${uid}')"><i class="fas fa-trash"></i></button>`}</td></tr>`});h+="</tbody></table></div>";ct.innerHTML=h})},50);return`<div id="a-users"><div class="text-center text-dim"><div class="spinner" style="margin:0 auto"></div></div></div>`}
function changeRole(uid,role){const rn={student:"Student",teacher:"Teacher",admin:"Admin"};if(!confirm(`Change role to ${rn[role]}?`))return;db.ref("users/"+uid+"/role").set(role).then(()=>{toast(`Role updated to ${rn[role]}!`,"success");renderATab()}).catch(fbErr)}
function delUser(uid){if(!confirm("Remove this user?"))return;db.ref("users/"+uid).remove().then(()=>{toast("User removed","success");renderATab()}).catch(fbErr)}

function renderAChats(){setTimeout(()=>{db.ref("chatRooms").once("value",snap=>{const rooms=snap.val()||{},ct=document.getElementById("a-chats");if(!ct)return;let h="";if(!Object.keys(rooms).length){h='<div class="text-dim text-center" style="padding:2rem">No chat rooms</div>'}else{Object.entries(rooms).forEach(([rid,room])=>{const names=room.participantNames||{},nl=Object.values(names).map(n=>esc(n)).join(" & ");h+=`<div class="card mb-1"><div class="flex items-center justify-between"><div><strong>${nl}</strong><div class="text-dim" style="font-size:.78rem">${esc(room.lastMessage||"No messages")} &bull; ${fmtDate(room.lastTimestamp)}</div></div><button class="btn btn-xs btn-secondary" onclick="adminViewChat('${rid}')"><i class="fas fa-eye"></i> View</button></div></div>`})}ct.innerHTML=h})},50);return`<div id="a-chats"><div class="text-center text-dim"><div class="spinner" style="margin:0 auto"></div></div></div>`}
function adminViewChat(rid){db.ref("chatMessages/"+rid).once("value",snap=>{const msgs=snap.val()||{},m=createModal("admin-chat-modal");let h='<div class="modal"><h3><i class="fas fa-eye text-primary"></i> Chat Messages</h3><div style="max-height:400px;overflow-y:auto">';const sorted=Object.entries(msgs).sort((a,b)=>(a[1].timestamp||0)-(b[1].timestamp||0));if(!sorted.length){h+='<div class="text-dim text-center" style="padding:1rem">No messages</div>'}else{sorted.forEach(([mid,msg])=>{h+=`<div class="chat-msg received" style="max-width:90%"><strong style="font-size:.75rem;color:var(--accent)">${esc(msg.senderName)}</strong><br>${esc(msg.content)}${S.userData?.role==="admin"?`<button class="chat-msg-delete" style="display:flex" onclick="delChatMsg('${rid}','${mid}');adminViewChat('${rid}')"><i class="fas fa-times"></i></button>`:""}<div class="chat-msg-time">${fmtDate(msg.timestamp)}</div></div>`})}h+=`</div><button class="btn btn-secondary w-full mt-2" onclick="closeModal('admin-chat-modal')" style="justify-content:center">Close</button></div>`;m.innerHTML=h;m.addEventListener("click",e=>{if(e.target===m)closeModal("admin-chat-modal")})})}

auth.onAuthStateChanged(user=>{if(user){S.currentUser=user;db.ref("users/"+user.uid).once("value",snap=>{let ud=snap.val();if(!ud){const role=(user.email&&user.email.trim().toLowerCase()===ADMIN_EMAIL.toLowerCase())?"admin":"student";ud={name:user.displayName||user.email.split("@")[0]||"User",email:user.email||"",phone:"",whatsapp:"",role:role,createdAt:firebase.database.ServerValue.TIMESTAMP,online:true};db.ref("users/"+user.uid).set(ud).then(()=>{S.userData=ud;S.currentSection="dashboard";render();toast(`Profile created! Role: ${role}`,"success")}).catch(fbErr);return}if(user.email&&user.email.trim().toLowerCase()===ADMIN_EMAIL.toLowerCase()&&ud.role!=="admin"){db.ref("users/"+user.uid+"/role").set("admin").then(()=>{ud.role="admin";S.userData=ud;S.currentSection="dashboard";db.ref("users/"+user.uid+"/online").set(true);render();toast("Admin privileges restored!","success")}).catch(fbErr);return}S.userData=ud;S.currentSection="dashboard";db.ref("users/"+user.uid+"/online").set(true);render()})}else{S.currentUser=null;S.userData=null;S.currentSection="landing";cleanListeners();render()}});

initBg();render();
window.addEventListener("beforeunload",()=>{if(S.currentUser)db.ref("users/"+S.currentUser.uid+"/online").set(false)});
</script>
</body>
</html>
